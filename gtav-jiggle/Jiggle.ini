; Jiggle.ini - every value that depends on the game build lives here.
; A blank value means UNKNOWN. Nothing below is a captured game value.
; Press the reload key (default F8) after editing; no game restart needed.

[General]
; Windows virtual-key codes. Defaults: F6 toggle, F7 layout probe, F8 reload, F9 nudge test (hold).
ToggleKey=0x75
ProbeKey=0x76
ReloadKey=0x77
NudgeKey=0x78
StartEnabled=1
; Metres a configured bone is pushed up while the nudge key is held (visible write test).
NudgeMeters=0.10
IncludeNearbyPeds=1
MaxPeds=16
MaxDistance=25.0

[Build]
; Which executable build the [Skeleton] values were captured on. Copy both from the
; "main module:" line in Jiggle.log. While either is blank the memory-writing feature stays gated.
ExpectedImageSize=
ExpectedTimeDateStamp=
Provenance=

[Skeleton]
; Runtime layout of the ped's object-space bone matrices (byte offsets in the live process):
;   cur = pedBase; for each offset in Chain: cur = *(uintptr_t*)(cur + offset)
;   translation(bone i) = cur + Bone0TranslationOffset + i * MatrixStride
; Chain=none means zero dereferences. Fill all four from a probe hit (F7); see README.
Chain=
Bone0TranslationOffset=
MatrixStride=
; Highest bone index you allow the plugin to touch (inclusive), e.g. from the ped model's skeleton.
MaxBoneIndex=
Provenance=

[Physics]
; Defaults for every bone. UNCALIBRATED starting values: tune by eye.
FrequencyHz=5.0
DampingRatio=0.25
Gain=1.0
MaxDisplacement=0.03
TeleportDistance=2.5
; Per-axis scale of the offset in the ped's local axes.
AxisRight=1.0
AxisForward=1.0
AxisUp=1.0

; One section per bone. Name is the bone name exactly as the game's bone-name lookup expects it.
; Any [Physics] key can be overridden inside a bone section. Blank Name = bone disabled.
; Bones should be leaves: only the bone's own matrix is written, its children do not follow.
;
; The two names below are CANDIDATES written from memory, NOT verified. The female upper-body
; models supplied for this project skin about 1000-1600 vertices each to skeleton bone indices
; 125 and 126, which sit mirrored at chest height. After the first probe (F7) Jiggle.log prints
; "jiggle bone '<name>' -> index N" for each name: if the indices are 125 and 126 the names are right.
; If it says "not on this ped model" the ped has no such bone or the name is wrong: change it here.
[Bone.L_Breast]
Name=SPR_L_Breast

[Bone.R_Breast]
Name=SPR_R_Breast

[Probe]
; Bones used to locate the skeleton in memory (two to six names that exist on the player ped model).
; Leave blank: the plugin tries SKEL_Head, SKEL_Spine3, SKEL_L_Hand, SKEL_R_Hand, SKEL_L_Foot and
; SKEL_R_Foot (names from memory, unverified) and uses those the model has.
; On a successful probe Jiggle.asi writes Jiggle.auto.ini with the build fingerprint and layout, so
; [Build] and [Skeleton] above can stay blank. Press the probe key again to try the next hit.
Bones=
RootWindowBytes=0x2000
WindowBytes=0x800
MaxDepth=2
MaxWindows=20000
Tolerance=0.02
; Candidate byte strides between consecutive bone matrices (default: 16,32,...,256).
;Strides=
